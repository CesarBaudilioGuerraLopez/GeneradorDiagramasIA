[theme]
primaryColor = "#004B9A"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#002D5F"
font = "sans serif"

[server]
maxUploadSize = 50
# enableCORS=false choca con XSRF y Streamlit lo anula; dejar defaults seguros
enableXsrfProtection = true

[browser]
gatherUsageStats = false
